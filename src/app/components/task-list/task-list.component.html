<div class="task-container">
  <h1>Task Manager</h1>
  <div class="task-input">
    <input 
      type="text" 
      placeholder="Enter a new task..." 
      [(ngModel)]="newTask" 
      (keyup.enter)="addTask()"
    />
    <button (click)="addTask()">Add</button>
  </div>
  <ul class="task-list">
    <li *ngFor="let task of tasks; let i = index" class="task-item">
      <span>{{ task }}</span>
      <button (click)="removeTask(i)">Remove</button>
    </li>
  </ul>
</div>
